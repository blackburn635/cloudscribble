name: CI — Typecheck, Lint, Test, Synth

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (postinstall builds shared)
        run: npm ci

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Lint all packages
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: CDK synth (no AWS credentials; placeholder account)
        working-directory: infrastructure
        env:
          CDK_DEFAULT_ACCOUNT: '111111111111'
        run: npx cdk synth --quiet
