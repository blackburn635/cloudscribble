# Amplify Hosting build spec — CloudScribble website (frontend/)
#
# The Amplify app is created once by hand in the console (CLAUDE.md, IaC exception 2):
#   develop → staging (staging.cloudscribble.com)    main → production (cloudscribble.com + www)
#
# Per-branch environment variables (Amplify console; public identifiers, not secrets):
#   VITE_API_URL              ApiUrl stack output
#   VITE_USER_POOL_ID         UserPoolId stack output
#   VITE_USER_POOL_CLIENT_ID  UserPoolClientIdWeb stack output
#   VITE_TURNSTILE_SITE_KEY   Cloudflare Turnstile site key for that environment
#   VITE_GA_MEASUREMENT_ID    main branch only
#
# Rewrites (console → Hosting → Rewrites and redirects), SPA fallback:
#   </^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp|mp4|webmanifest)$)([^.]+$)/>  →  /index.html  (200)
version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - npm ci
            - rm -f packages/shared/tsconfig.tsbuildinfo
            - npm run build:shared
        build:
          commands:
            - npm run build:frontend
      artifacts:
        baseDirectory: frontend/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - packages/shared/dist/**/*
      buildPath: /

customHeaders:
  - pattern: '**/*'
    headers:
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://www.googletagmanager.com https://challenges.cloudflare.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com;
          font-src 'self';
          media-src 'self';
          connect-src 'self'
            https://*.execute-api.us-east-2.amazonaws.com
            https://cognito-idp.us-east-2.amazonaws.com
            https://*.google-analytics.com
            https://*.analytics.google.com
            https://www.googletagmanager.com
            https://challenges.cloudflare.com;
          frame-src https://challenges.cloudflare.com;
          frame-ancestors 'none';
          object-src 'none';
          base-uri 'self';
          form-action 'self'
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - key: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
  - pattern: 'index.html'
    headers:
      - key: Cache-Control
        value: no-cache
  - pattern: 'assets/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
